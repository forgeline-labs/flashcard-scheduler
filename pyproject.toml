[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcard-scheduler"
version = "0.1.0"
description = "SM-2 spaced repetition scheduler for JSON flashcard decks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Corpus Lote 2" }]
keywords = ["flashcards", "spaced-repetition", "sm-2", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
flashcard-scheduler = "flashcard_scheduler.cli:main"

[tool.setuptools]
packages = ["flashcard_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
