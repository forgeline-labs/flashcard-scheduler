name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run black-box test suite
        run: python -m pytest

      - name: Native Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = & .\app.cmd --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "flashcard-scheduler 0.1.0") { throw "launcher failed" }
